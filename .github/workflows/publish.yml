# Tag-triggered publish flow for deploy-platform service repos.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-image -> resolve-image-lock -> publish-deploy-artifact -> register-service
#                                       -> fragment (the estate path)
#
# Boundary rule (R1-2): the image lock crosses the reusable-workflow boundary
# as an UPLOADED ARTIFACT (image-lock-artifact), never as a runner-local path.
# deploy-artifact.yml downloads the artifact itself; there is no intermediate
# download job and no image-lock-path input on the deploy-artifact call.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0)'
        required: true
        type: string

permissions: {}

jobs:
  # -- 1. Build and push the container image --------------------------------
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    with:
      platforms: linux/amd64,linux/arm64
      image-name: auth-api/auth-api
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write

  # -- 2. Resolve the image lock (upload artifact, never path) --------------
  resolve-image-lock:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: images-lock-${{ github.run_id }}
      fragment-images-lock-artifact: fragment-images-lock-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: resolve-image-digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/auth-api/auth-api
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve a digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

      - name: lock-image
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image-digest }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "null" ]; then
            echo "E_FLOATING_IMAGE: IMAGE_DIGEST is empty" >&2
            exit 1
          fi
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "E_FLOATING_IMAGE: IMAGE_DIGEST is not a digest ref (got: $IMAGE_DIGEST)" >&2; exit 1 ;;
          esac
          printf '{"auth-api":"ghcr.io/jorisjonkers-dev/auth-api/auth-api@%s"}\n' "$IMAGE_DIGEST" \
            > platform/images.lock.json
          echo "Locked image: ghcr.io/jorisjonkers-dev/auth-api/auth-api@${IMAGE_DIGEST}"

      - name: verify-lock
        run: |
          set -euo pipefail
          lock_ref=$(jq -r '.["auth-api"]' platform/images.lock.json)
          case "$lock_ref" in
            *@sha256:*) echo "Digest pin verified: $lock_ref" ;;
            *) echo "E_FLOATING_IMAGE: lock ref is not digest-pinned: $lock_ref" >&2; exit 1 ;;
          esac

      - name: upload-image-lock
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: images-lock-${{ github.run_id }}
          path: platform/images.lock.json
          retention-days: 1

      - name: lock-fragment-images
        # The estate path's images lock: this release's auth-api, and the
        # auth-ui of auth-ui's latest release, since the two are one
        # Application (deploy/auth.project.yml). Each with the numeric user it
        # runs as, read back from what was pushed rather than assumed
        # (deploy-kit spec/v1/20-resolved-deployment.md#the-images-lock). An
        # image that names no user runs as root, and a root image is refused
        # here: deploy-kit 0.31 renders its uid 0 beside runAsNonRoot, which the
        # kubelet refuses at pod start, so a lock naming one would take sign-in
        # down on the estate path. Each entry's version is its own release's
        # (JorisJonkers-dev/workspace#140).
        env:
          GH_TOKEN: ${{ github.token }}
          API_IMAGE: ghcr.io/jorisjonkers-dev/auth-api/auth-api
          API_DIGEST: ${{ steps.digest.outputs.image-digest }}
          UI_IMAGE: ghcr.io/jorisjonkers-dev/auth-ui
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # user <image@digest>: the uid:gid it runs as.
          user() {
            local named
            named="$(docker buildx imagetools inspect "$1" --format '{{ json .Image }}' \
              | jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end | .config.User // ""')"
            case "$named" in
              ""|root|0|0:*) echo "::error::$1 runs as root; the estate path runs only a non-root image" >&2; return 1 ;;
              *[!0-9:]*) echo "::error::$1 runs as '${named}', not a numeric uid[:gid]" >&2; return 1 ;;
              *:*) echo "$named" ;;
              *) echo "${named}:${named}" ;;
            esac
          }
          ui_tag="$(gh release view --repo JorisJonkers-dev/auth-ui --json tagName --jq .tagName)"
          ui_digest="$(docker buildx imagetools inspect "${UI_IMAGE}:${ui_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          case "$ui_digest" in
            sha256:*) ;;
            *) echo "E_FLOATING_IMAGE: could not resolve a digest for ${UI_IMAGE}:${ui_tag}" >&2; exit 1 ;;
          esac
          api_user="$(user "${API_IMAGE}@${API_DIGEST}")"
          ui_user="$(user "${UI_IMAGE}@${ui_digest}")"
          cat > images.lock.yml <<LOCK
          apiVersion: lock.jorisjonkers.dev/v1
          kind: ImagesLock
          schemaVersion: 1.0.0
          name: auth
          images:
            auth-api:
              repository: ${API_IMAGE}
              digest: "${API_DIGEST}"
              uid: ${api_user%%:*}
              gid: ${api_user##*:}
              version: "${TAG#v}"
            auth-ui:
              repository: ${UI_IMAGE}
              digest: "${ui_digest}"
              uid: ${ui_user%%:*}
              gid: ${ui_user##*:}
              version: "${ui_tag#v}"
          LOCK
          echo "auth-ui ${ui_tag}" >> "$GITHUB_STEP_SUMMARY"
          cat images.lock.yml >> "$GITHUB_STEP_SUMMARY"

      - name: upload-fragment-image-lock
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fragment-images-lock-${{ github.run_id }}
          path: images.lock.yml
          retention-days: 1

  # -- 3. Render and publish the deploy artifact ----------------------------
  publish-deploy-artifact:
    needs: [resolve-image-lock]
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-artifact.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      artifact-name: auth-api
      artifact-version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      schema-version: 0.22.0
      apply-bundle: true
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:95dc39fc695694c8fb4b0c538d7fe13038d407c7302c3725c98f0496c6a83499
      deploy-dir: platform
      image-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
      environments: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # -- 4. Publish the Intent Fragment and start composition ------------------
  # The project file, packed with this release's share of the images lock,
  # pushed, signed keyless and verified, then composition dispatched in
  # JorisJonkers-dev/estate (deploy-kit spec/v1/40-composition.md#fragments).
  # `auth` is still delivered by fleet-infra: the estate composes the fragment
  # and delivers nothing for it. It is validated alone: `data` and `mail`, what
  # it depends on, publish from the private estate repository, so their
  # fragments are packages this repository's token cannot read. Composition
  # checks every edge against them.
  #
  # A tag push only: a dispatch re-runs an older tag, whose tree may hold no
  # project file, and the fragment names the commit its images were built from.
  fragment:
    needs: [resolve-image-lock]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@f3bb6cabaa6ee33694f8632ce273a4e703d60780 # v0.38.0
    with:
      project-file: deploy/auth.project.yml
      # The env files wire the Vault client the transit grant needs.
      validate-with: deploy/env
      version: ${{ github.ref_name }}
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.fragment-images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}

  # -- 5. Tell fleet-infra the image exists ---------------------------------
  #
  # auto-bump-first-party-images.yml brings the pins in cluster/flux up to the
  # newest published tag. It accepts this dispatch precisely so a service does
  # not have to wait for its `*/30` cron -- which this org has measured
  # delivering two to four runs per repo per day, hours late. v0.9.1 fixed a
  # total sign-in outage and then sat unpinned until the bump was triggered by
  # hand.
  #
  # Deliberately a separate job rather than a step on the publish: the image and
  # the deploy artifact are already published by the time this runs, and a
  # notification failing must not mark that publish failed. If this job fails
  # the cron still picks the release up, so the worst case is the behaviour we
  # have today, reported loudly instead of silently.
  #
  # Nothing here bypasses a gate. The bump opens a pull request whose required
  # checks still have to pass, and publish-deploy-branch still gates on the
  # deploy-production environment.
  notify-fleet-infra:
    name: Notify fleet-infra
    needs: [publish-deploy-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: mint-app-token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # GITHUB_TOKEN is scoped to this repository and cannot dispatch to
          # another one, so the token has to be minted for fleet-infra.
          owner: JorisJonkers-dev
          repositories: fleet-infra

      - name: assert-token-minted
        # Fail loudly if the App token is missing -- never fall back to
        # GITHUB_TOKEN, matching release.yml.
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "E_APP_TOKEN_MISSING: Release App token was not minted." >&2
            echo "Secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must be configured," >&2
            echo "and the App must be installed on JorisJonkers-dev/fleet-infra." >&2
            echo "GITHUB_TOKEN fallback is intentionally forbidden." >&2
            exit 1
          fi
          echo "App token minted successfully (token prefix: ${APP_TOKEN:0:4}...)"

      - name: dispatch-image-published
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/JorisJonkers-dev/fleet-infra/dispatches \
            -f event_type=image-published \
            -f "client_payload[service]=auth-api" \
            -f "client_payload[version]=$TAG"
          echo "Dispatched image-published to fleet-infra for auth-api $TAG"
