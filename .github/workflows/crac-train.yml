name: 'CRaC Train'

'on':
  workflow_dispatch:

permissions:
  contents: 'read'
  packages: 'read'

jobs:
  train:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/crac-train.yml@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
    with:
      require-package-proxy: true
      service-matrix: >-
        [
          {
            "service": "auth-api",
            "context": ".",
            "dockerfile": "Dockerfile",
            "port": 8081,
            "db_name": "auth_db",
            "db_user": "auth_user",
            "db_password": "auth_password",
            "sidecars": ["postgres", "valkey", "rabbitmq"]
          }
        ]
    secrets:
      packages-token: '${{ secrets.GITHUB_TOKEN }}'
      PACKAGES_PROXY_TOKEN: '${{ secrets.PACKAGES_PROXY_TOKEN }}'
